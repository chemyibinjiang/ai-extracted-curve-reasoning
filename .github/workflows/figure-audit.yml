name: Figure reproducibility checks

on:
  push:
    paths:
      - 'figures/manuscript/**'
      - 'figures/supporting/figure7/**'
      - 'figures/*.md'
      - 'analysis/figure6/expected/**'
      - 'analysis/README.md'
      - 'analysis/figure3/**'
      - 'analysis/tafel_explorer/**'
      - 'benchmark_data/benchmark_curve_extraction/**'
      - 'analysis/figure5/**'
      - 'analysis/figure4/**'
      - 'analysis/figure6/**'
      - 'analysis/figure7/**'
      - 'analysis/figure8/**'
      - 'analysis/effective_bv/**'
      - 'analysis/common/**'
      - 'analysis/SOURCE_MANIFEST.json'
      - 'data_literature/zenodo_extracted_curve_dataset_v1/**'
      - 'data_literature/zenodo_extracted_curve_dataset_v1.zip'
      - 'requirements-analysis.txt'
      - 'reproducibility/**'
      - 'scripts/validate_figures.py'
      - 'scripts/audit_raw_to_analysis.py'
      - 'scripts/validate_dataset.py'
      - 'scripts/validate_release_inventory.py'
      - 'PUBLIC_REPO_FILE_LIST_SHA256.csv'
      - 'tests/**'
      - 'exploration/**'
      - 'README.md'
      - 'CODE_ORGANIZATION.md'
      - 'REPRODUCIBILITY.md'
      - 'RELEASE_CHECKLIST.md'
      - '.gitignore'
      - '.github/workflows/figure-audit.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  figure-tables:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve manuscript figure assets
        run: git lfs pull --include="figures/manuscript/**" --exclude=""
      - name: Validate artwork and numerical summaries
        run: python scripts/validate_figures.py
      - name: Test scientific regression guards
        run: python -m unittest discover -s tests -p test_figure_tables.py -v
      - name: Check exploration links and release boundaries
        run: python -m unittest discover -s tests -p test_repository_layout.py -v

  numerical-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install numerical dependencies
        run: python -m pip install -r requirements-analysis.txt
      - name: Retrieve data and artwork used by the full tests
        run: git lfs pull --include="data_literature/*.zip,figures/manuscript/**,figures/supporting/figure7/**,analysis/effective_bv/artwork_templates.zip,analysis/effective_bv/published/**,analysis/figure8/inputs/*.zip,exploration/archive/**,benchmark_data/benchmark_curve_extraction/**" --exclude=""
      - name: Validate the release inventory
        run: python scripts/validate_release_inventory.py
      - name: Run all regression and isolated-reproduction tests
        run: python -m unittest discover -s tests -v
