name: Figure reproducibility checks

on:
  push:
    paths:
      - 'figures/manuscript/**'
      - 'figures/supporting/figure7/**'
      - 'figures/Figure5_caption.md'
      - 'analysis/figure6/expected/**'
      - 'analysis/figure5/**'
      - 'analysis/figure4/**'
      - 'analysis/figure6/**'
      - 'analysis/figure7/**'
      - 'analysis/effective_bv/**'
      - 'analysis/common/**'
      - 'analysis/SOURCE_MANIFEST.json'
      - 'data_literature/zenodo_extracted_curve_dataset_v1/**'
      - 'data_literature/zenodo_extracted_curve_dataset_v1.zip'
      - 'requirements-analysis.txt'
      - 'reproducibility/**'
      - 'scripts/validate_figures.py'
      - 'scripts/audit_raw_to_analysis.py'
      - 'scripts/validate_dataset.py'
      - 'tests/**'
      - 'exploration/**'
      - 'README.md'
      - 'CODE_ORGANIZATION.md'
      - 'REPRODUCIBILITY.md'
      - '.gitignore'
      - '.github/workflows/figure-audit.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  figure-tables:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve manuscript figure assets
        run: git lfs pull --include="figures/manuscript/**" --exclude=""
      - name: Validate artwork and numerical summaries
        run: python scripts/validate_figures.py
      - name: Test scientific regression guards
        run: python -m unittest discover -s tests -p test_figure_tables.py -v
      - name: Check exploration links and release boundaries
        run: python -m unittest discover -s tests -p test_repository_layout.py -v

  numerical-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install numerical dependencies
        run: python -m pip install -r requirements-analysis.txt
      - name: Retrieve coordinate and analysis archives
        run: git lfs pull --include="data_literature/zenodo_extracted_curve_dataset_v1.zip,exploration/archive/*.zip" --exclude=""
      - name: Audit raw coordinates through analysis inputs
        run: python -m unittest discover -s tests -p test_raw_archive.py -v
      - name: Test numerical cores and isolated figure analyses
        run: python -m unittest discover -s tests -p test_figure_analysis.py -v
      - name: Test direct NiMo kinetic fitting and coverage
        run: python -m unittest discover -s tests -p test_nimo_vht.py -v
      - name: Test candidate grid and selected-template residuals
        run: python -m unittest discover -s tests -p test_effective_search.py -v
      - name: Test partial-observation PCA and observed-current summaries
        run: python -m unittest discover -s tests -p test_figure7.py -v
